[project]
name = "boec"
version = "0.1.0"
description = "SPADE: sequential design and conservative operating-region estimation under fixed well budgets"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Joseph Yung"},
  {name = "Alana Kwan"},
]
keywords = ["bayesian-optimization", "design-of-experiments", "gaussian-process", "cell-manufacturing"]

[project.urls]
Repository = "https://github.com/akwnn/nutrigene-ai-bo-ipsec"

# Without these, `boec` is importable ONLY under pytest, via the `pythonpath`
# setting below. Reproduction setup is `pip install -r requirements.txt` followed by
# `pip install -e .`. Runtime dependencies remain pinned in `requirements.txt`; this research
# package is not currently configured for independent package-index distribution.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["software/src"]

[tool.pytest.ini_options]
pythonpath = ["software/src"]
testpaths = ["software/tests"]
markers = [
    # Runs a real BO campaign rather than a unit check. Kept IN the default suite on
    # purpose -- it is the E1 kill condition, and a kill condition that only runs when
    # someone remembers to ask for it is not a kill condition. Deselect with -m "not slow".
    "slow: exercises a full optimisation loop (tens of seconds)",
]
