[project]
name = "boec"
version = "0.1.0"
requires-python = ">=3.11"

# Without these, `boec` is importable ONLY under pytest, via the `pythonpath`
# setting below. Every `python scripts/run_*.py` command named beside a number in
# docs/RESULTS-PERSON-A.md died on `ModuleNotFoundError: No module named 'boec'`
# from a clean checkout -- 22 of 26 scripts. Reproduction instructions that have
# never been run from a fresh clone are not reproduction instructions.
# Setup is now: pip install -r requirements.txt && pip install -e .
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"boec.paper_figures" = [
    "*.mplstyle",
    "fonts/*.ttf",
    "fonts/*.otf",
    "fonts/*.txt",
    "fonts/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    # Runs a real BO campaign rather than a unit check. Kept IN the default suite on
    # purpose -- it is the E1 kill condition, and a kill condition that only runs when
    # someone remembers to ask for it is not a kill condition. Deselect with -m "not slow".
    "slow: exercises a full optimisation loop (tens of seconds)",
]
