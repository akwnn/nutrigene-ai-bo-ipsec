# E4 — extrapolation-driven over-prediction. Person B.
#
# PRE-REGISTRATION. Values marked PRE-REGISTERED are fixed before the run they
# govern. Recorded in git, with a date, so "you chose the settings that
# flattered the result" is not available as an objection.

preregistration_version: 2

# =============================================================================
# VERSION 2 — what changed, and why. Written BEFORE the confirmatory run.
# =============================================================================
#
# Version 1 ran 10 landscapes x 4 kappa and is reported in
# results/E4-FIRST-RESULTS.md. Two changes follow. Both were decided before
# re-running, and neither depends on the sign or size of what version 1 found.
#
# -----------------------------------------------------------------------------
# CHANGE 1 — the scoring region. Unit cube -> [0, rho * kappa * x*], rho = 2.0
# -----------------------------------------------------------------------------
# Person A's objection (OPEN-QUESTIONS Q12), accepted.
#
# Scoring over the whole unit cube asks every model about territory 2-4x
# further out than anything it measured, in all six ingredients at once. The
# published study that motivates this project extrapolated 1.2x, in one
# ingredient. Version 1 measured the consequence: the traditional method's
# interval came out around 7 times the entire response range, which makes
# "its interval is too narrow" unavailable as a finding, because an interval
# that wide covers almost anything. A reviewer would call the regime staged.
#
# A's kappa-by-rho sweep also showed the finding is *recoverable* at rho = 2.0:
# the traditional method's interval covers the truth 79.8% of the time when it
# claims 95%. That is the interval being too narrow, measurably, in a regime
# whose geometry is defensible.
#
# The unit cube is retained as a reported limiting case, not dropped.
#
# -----------------------------------------------------------------------------
# CHANGE 2 — landscapes. 10 -> 40
# -----------------------------------------------------------------------------
# THE JUSTIFICATION MATTERS MORE THAN THE NUMBER. Raising n because a result
# missed significance, then reporting it as though n had been chosen in
# advance, is what makes a finding unpublishable.
#
# n = 40 is NOT powered against the +0.051 that version 1 observed. It is sized
# from the pilot's DESIGN AND SPREAD ONLY, by Simonsohn's small-telescopes
# procedure (Psychological Science 2015):
#
#   * smallest effect worth caring about = the effect n = 10 had 33% power to
#     detect. At df = 9 and the pilot's per-cell spread (~0.16) that is
#     dz ~ 0.48, i.e. a difference in Spearman rho of about 0.08.
#   * Simonsohn's multipliers: 2.5x original for 80% power to reject it,
#     3.5x for 90%, 4.5x for 95%. n = 40 is 4x, so roughly 92%.
#
# This quantity depends on the number of landscapes and their variability. It
# does not depend on the observed effect, which is what makes re-planning from
# it standard practice rather than p-hacking (Wittes & Brittain 1990, internal
# pilot / blinded sample-size re-estimation: re-planning from a NUISANCE
# parameter does not inflate error rates; re-planning from the observed effect
# does).
#
# Sizing on the observed effect would also have been unstable: at kappa = 0.7
# the observed difference was 0.009, for which the naive calculation demands
# about 1200 landscapes. That instability is the tell that it is the wrong tool.
#
# THE GOAL IS A CONVINCING NULL, NOT A RESCUED POSITIVE. A null at 10
# landscapes reads as "underpowered, cannot tell". At 40 it reads as "we looked
# hard and it is not there", and supports the equivalence claim below. If the
# difference does clear zero at 40, it is reported honestly and noted as too
# small to matter practically. Both outcomes are publishable, which is the test
# of a well-posed decision.
#
# Sentence for the paper, fixed now:
#
#   "At the pre-registered n = 10 the paired difference in Spearman rho between
#    the GP and the nearest-neighbour null was +0.051, 95% CI [-0.031, +0.118],
#    not significant but consistent in sign across all four kappa. We re-ran at
#    n = 40 landscapes, sized by Simonsohn's small-telescopes procedure against
#    a smallest effect of interest of 0.08 derived from the pilot's variance
#    alone. This decision was fixed before the confirmatory run and does not
#    depend on the observed point estimate."

# --- fixed by spec ------------------------------------------------------------
dim: 6                    # d=8 excluded: 45 terms at n=48 leaves 3 residual df
n_subbox: 48              # 32 factorial + 12 axial + 4 centre
kappa: [0.6, 0.7, 0.8, 0.9]
sub_box_design: ccd       # NOT space-filling: (X'X)^-1 IS the comparator

# --- PRE-REGISTERED (v2) ------------------------------------------------------
#
# AMENDMENT, made BEFORE the confirmatory run, for a reason independent of any
# result: Person A's committed ensemble contains 25 landscapes at d=6, not 40.
# Extending it is A's call — it is A's module and A's data — and requires
# re-running scripts/generate_oracles.py with a larger --n-instances.
#
# 25 is not a fallback chosen for convenience. It is 2.5x the pilot's 10, which
# is exactly Simonsohn's multiplier for 80% power to reject the pre-registered
# smallest effect of interest (0.08). The 40 above corresponded to ~92%.
#
# So: run at 25 now, and if A extends the ensemble, re-run at 40 as originally
# specified. Both numbers and their power are fixed here in advance, so neither
# can be chosen later on the basis of which one gave a nicer answer.
n_instances: 25           # v1 was 10. 2.5x the pilot -> ~80% power.
n_instances_if_ensemble_extended: 40   # 4x -> ~92% power. Needs A.
rho: 2.0                  # v1 was the unit cube. See CHANGE 1.
rho_reported_also: [inf]  # unit cube kept as a limiting case
primary_cell: {kappa: 0.6, rho: 2.0}

# =============================================================================
# VERSION 2 ADDENDUM — T1-T4 carried in. Written BEFORE the confirmatory run.
# =============================================================================
#
# TASKS.md Gate 0 requires Q12, Q14, Q15 and Q16 to land as ONE bump. The four
# blocks below carry them. `preregistration_version` was already 2 when this was
# written, so this is not a version change — it is the v2 content finally
# matching what v2 was declared to contain. Recorded that way rather than
# silently re-bumping, because a version number that moves without a diff is
# exactly what a pre-registration is supposed to make impossible.
#
# -----------------------------------------------------------------------------
# T4 / Q12 — the regime. A proposed, B agreed. Recorded as decided.
# -----------------------------------------------------------------------------
# Already live below as `rho: 2.0` and `primary_cell`. Nothing changes; this
# note exists so the decision has a date and an owner rather than only a value.
#
# -----------------------------------------------------------------------------
# T3 / Q14 — n. THE POWER TABLE IN Q14 IS STALE AND MUST NOT BE USED AS WRITTEN.
# -----------------------------------------------------------------------------
# Those n's (~31, ~44) were computed on the UNIT-CUBE effect (+0.051), which is
# the regime v2 deprecates. In the pre-registered primary regime the point
# estimate is NEGATIVE (-0.027). No n produces a GP advantage, because there is
# no advantage to find.
#
# What n = 40 actually buys is MARGIN ON THE EQUIVALENCE BOUND, not power. At
# n = 25 the one-sided limits are -0.0658 / +0.0112 against a bound of +/-0.08,
# so the lower limit clears by only ~0.014 — thin enough to be sensitive to the
# bootstrap seed. At n = 40 it moves to roughly -0.058.
#
# Recomputed independently from results/e4-robustness.json by B; the upper limit
# reproduces A's to within rounding (+0.0112 vs A's +0.0113), which is the check
# that the two sides are computing the same estimand.
#
# DECISION: n_instances stays 25 for the confirmatory run, 40 when A's ensemble
# extension is in hand. Both numbers and both rationales were fixed in advance,
# so neither can be selected later on which gave the nicer answer.
n_instances_rationale: equivalence_margin_not_power   # NOT the stale Q14 table

# -----------------------------------------------------------------------------
# T1 / Q16 — the replacement primary, and B's registered amendment to it.
# -----------------------------------------------------------------------------
# A's original rho-trend primary was WITHDRAWN as a tautology: boxes are nested
# in rho, the fitted surface is identical across rho, and y_true <= 1, so
# over-prediction rises with rho by arithmetic. The kappa trend stands.
#
# A's replacement: the second-order prediction interval loses nominal coverage
# as rho increases, and we report the rho at which it crosses.
#
# B ACCEPTED the claim and OBJECTED to the reported quantity. Both are recorded
# in OPEN-QUESTIONS Q16; the operative part is here.
#
# Accepted because it is genuinely falsifiable, for a structural reason: for a
# second-order model the regressor vector already contains the quadratic terms,
# so leverage scales as lambda^4 and the half-width as lambda^2 — the SAME order
# as the fitted surface's divergence from a bounded truth. Neither dominates by
# construction. Confirmed in results/pf1-grid.log: from rho=1.2 to the cube,
# over-prediction grows x63/x30/x21/x12 against interval x44/x31/x20/x14 at
# kappa 0.6/0.7/0.8/0.9.
#
# Objected to because "the rho at which it crosses" presumes ONE crossing. The
# ratio of median over-prediction to median half-width is non-monotone at every
# kappa — it peaks around rho=2-3 and falls back — and at kappa 0.8 and 0.9 it
# crosses 1 upward and then back down. Caveat stated in Q16 and repeated here:
# a ratio of medians is NOT the coverage rate, so this is a well-posedness risk,
# not a proof. preflight_pf1.py already records `over` and `pi` per cell, so the
# real rate is a reporting change rather than a new experiment.
# AMENDED after the rate was computed (scripts/pf1_coverage.py, 800 cells). The
# first version of this block registered a single coverage surface and made the
# crossing conditional on monotonicity. Both were superseded:
#
#   * There are ZERO crossings, not the two the ratio-of-medians suggested.
#     Coverage never reaches nominal anywhere -- highest cell 0.625 against 0.95,
#     including at rho=1.2. The crossing is undefined because the interval never
#     had nominal coverage to lose. The objection's conclusion survived; its
#     stated mechanism did not, and the correction is recorded in Q16.
#
#   * THE DECISIVE DEFECT: the registered sentence never named the POINT SET.
#     Coverage at the model's own argmax and coverage over the domain are both
#     "coverage of the second-order prediction interval", and they return
#     OPPOSITE verdicts -- A's 96-98% at rho=1.2 is domain-wide, the 0.475 above
#     is at the argmax. A primary two people can compute correctly and disagree
#     about is not a pre-registration.
#
# NOTE ON ORDER, which is the part that matters for the record: the amendment
# structure below was written and committed BEFORE the coverage rate existed.
# Seeing the numbers changed the mechanism and added the point-set split; it did
# not choose the endpoint.
interval_coverage:
  nominal: 0.95
  computed_as: fraction_of_cells_with_abs_over_prediction_le_half_interval
  # BOTH point sets, each a surface on the registered grid. Mirrors the structure
  # E3 already uses, and applies Q16's own "the grid is the result" logic to its
  # replacement primary instead of exempting it.
  point_sets:
    constrained_argmax:  # decision-relevant, and the worst case -- the argmax is
                         # selected for high predicted value, so this carries a
                         # selection effect BY DESIGN. It is the recipe a
                         # practitioner would actually run.
      estimand: coverage_surface_over_kappa_rho_grid
      role: primary
    held_out_sobol:      # domain-wide, no selection effect.
      estimand: coverage_surface_over_kappa_rho_grid
      role: primary
  # The gap between the two surfaces is itself reported: it is the difference
  # between "well calibrated" and "well calibrated except where it sends you".
  report_gap_between_point_sets: true
  report_crossing_rho: where_one_exists
  falsified_if: coverage_flat_near_nominal_across_the_whole_grid_at_both_point_sets

# -----------------------------------------------------------------------------
# T2 / Q15 — the DoE arm's dropped-factor hold level. B's call.
# -----------------------------------------------------------------------------
# Governs E2's DoE arm, whose stage-4 confirmation IS E4a viewed from the other
# end, which is why it is registered here rather than nowhere. **A: carry these
# into configs/experiment/e2.yaml when T11 lands — an inherited default is not a
# pre-registration.**
#
# Registered with NEITHER ARM RUN: the `zero` policy did not exist in doe.py
# when this was decided, so there was no number to choose between.
#
# The two policies are not symmetric. `best_stage1` is CONSERVATIVE — stage 2
# stays near the region stage 1 found good, so there is less distance to
# extrapolate and the over-promise is HARDER to demonstrate. `zero` is
# FLATTERING, through screen error: the screen recovers 94% of planted active
# factors at sigma_rel=0.10 and 86% at 0.25, and pinning a wrongly-dropped
# ACTIVE factor to zero drags stage 2 somewhere genuinely worse. The
# conservative arm is the primary, on the same principle that rejected
# stage2_half_width = 0.5.
doe_arm:
  hold_dropped_at: best_stage1        # PRE-REGISTERED PRIMARY (doe.py default)
  hold_dropped_at_sensitivity: zero   # DECLARED, reported always — not only if it agrees
  # Fixed per Q15. At 0.5 stage 2 spans the whole range, the predicted optimum
  # cannot fall outside it, and the escape statistic is vacuously 0%.
  stage2_half_width: 0.25
  # If `zero` over-promises LESS, the screen-error argument above is wrong and
  # that is reported as a failed prediction. It does not license swapping the
  # primary.
  swapping_primary_on_result: forbidden

# --- PRE-REGISTERED (v1, unchanged) -------------------------------------------
discrimination:
  n_candidates: 512
  primary: spearman_rho
  auc_tau_quantile: 0.80  # within-instance quantile, so instances compare

  scorers:
    - gp_predictive_sd            # the claim
    - second_order_pi_width       # the DoE comparator
    - nearest_neighbour_distance  # the model-free null that must be beaten

  report_scorer_correlation_matrix_first: true
  no_headroom_threshold: 0.95

  # Resample LANDSCAPES, never cells. Four kappa on one landscape are four
  # measurements of the same landscape. Version 1 pooled cells and its interval
  # came out 1.45x too narrow; fixed before this run.
  bootstrap: instance_level
  n_bootstrap: 2000

  # Distribution-free confirmation. At 40 landscapes the sign arrangements can
  # no longer all be enumerated, so this samples; at 10 it was exact.
  exact_sign_test: true

  # PRE-REGISTERED (v2): the equivalence claim, if the difference does not
  # clear zero. States a bound rather than "we found nothing".
  equivalence_bound: 0.08   # smallest difference in Spearman rho worth having
  equivalence_test: tost_one_sided

# --- models fitted to identical points -----------------------------------------
models:
  second_order:         {primary: true,  prediction_interval: true}
  stepwise_third_order: {primary: false, prediction_interval: false}
  gp:                   {primary: false, prediction_interval: true}
  parametric:           {primary: false, prediction_interval: false}
