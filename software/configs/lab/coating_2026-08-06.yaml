# In-house fibronectin/vitronectin coating titration, acquired 2026-08-06.
#
# This is NOT the Hall/Ogle six-protein ECM cube. Collagen I/IV and laminins 111/411/511
# were never varied here, so these points cannot replay Phase 2 and must not be coded
# onto the Phase 1/2 [0,1]^6 cube.
#
# Coded dose is (ug/mL - 0.5) / 19.5 -- coded against THIS box, whose floor is 0.5 and
# ceiling 20 ug/mL. Hall/Ogle's fibronectin attachment floor is 22 ug/mL, so this entire
# series sits below the published floor. That is the scientifically interesting side of
# their result, and it is also why the two boxes cannot share a coding.
#
# coating: 0 = fibronectin, 1 = vitronectin. Declared continuous because Phase 1
# optimizers do not consume the `categorical` branch of the schema; the campaign is
# expected to run in discrete-candidate mode, where only the 12 measured rows are ever
# proposed and the coating axis therefore never takes an intermediate value.
parameters:
  - name: coating
    unit: coded
    ptype: continuous
    physical_low: 0.0
    physical_high: 1.0
  - name: dose
    unit: ug/mL
    ptype: continuous
    physical_low: 0.5
    physical_high: 20.0

# CytoFLEX LX, not NovoCyte: every one of the 52 FCS files reports $CYT = "CytoFLEX LX",
# serial BG17015. The .xit sidecar is CytExpert's format, which is what caused the
# original misattribution. See research/data/lab/overlay/GATE.md.
metric:
  name: CD31_pct_flow
  unit: percent_of_parent
  protocol_version: cytoflexlx-cd31-cd140a-2026-08-06

constraints:
  equality: []
  inequality: []
  nonlinear_inequality: []
